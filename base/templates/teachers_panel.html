<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teachers Panel</title>
    <style>
      /* Body Styling */
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #74ebd5, #acb6e5);
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        margin: 0;
      }

      /* Page Title Styling */
      h1 {
        color: #444;
        font-size: 2.5rem;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      /* Table Styling */
      table {
        width: 80%;
        border-collapse: collapse;
        margin-bottom: 30px;
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      }

      th,
      td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }

      th {
        background-color: #3498db;
        color: white;
        font-weight: bold;
        font-size: 1.2rem;
        text-transform: uppercase;
      }

      td {
        font-size: 1rem;
        color: #555;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      tr:hover {
        background-color: #f1c40f;
        color: white;
      }

      /* Home Button Styling */
      .home-button {
        padding: 10px 20px;
        font-size: 1.2rem;
        background-color: #e74c3c;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
      }

      .home-button:hover {
        background-color: #c0392b;
        transform: translateY(-3px);
      }

      .home-button:active {
        transform: translateY(2px);
      }

      /* Optional Media Queries for Responsive Design */
      @media (max-width: 768px) {
        table {
          width: 100%;
        }

        th,
        td {
          padding: 10px;
        }

        h1 {
          font-size: 2rem;
        }

        .home-button {
          font-size: 1rem;
          padding: 8px 15px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Teachers Panel</h1>
    <table>
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Time Taken</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        {% for feedback in feedback_list %}
        <tr>
          <td>{{ feedback.student_name }}</td>
          <td>{{ feedback.time_taken }}</td>
          <td>{{ feedback.score }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="3">No feedback available</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <button class="home-button" onclick="window.location.href='/'">Home</button>
  </body>
</html>
